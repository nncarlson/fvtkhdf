<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 365" width="540" height="365"
     role="img" aria-labelledby="title description">
  <title id="title">Two MPI ranks divide the cell grid</title>
  <desc id="description">Rank 0 owns x cell indices 0 through 11 on the left.
    Rank 1 owns x cell indices 12 through 23 on the right. Both span the full y
    range from 0 to 0.75, and the slabs meet at x equals 0.5.</desc>
  <rect width="540" height="365" rx="8" fill="#fff"/>
  <path d="M90 28H282V316H90Z" fill="#e5f1f8"/>
  <path d="M282 28H474V316H282Z" fill="#f7eadb"/>
  <path d="M90 28H474V316H90Z M282 28V323 M90 316V323 M474 316V323
           M83 28H90 M83 316H90" fill="none" stroke="#224e6b" stroke-width="2"/>
  <g fill="#172c3d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="186" y="165" font-size="21" font-weight="bold">Rank 0</text>
    <text x="186" y="191">x cell indices 0–11</text>
    <text x="378" y="165" font-size="21" font-weight="bold">Rank 1</text>
    <text x="378" y="191">x cell indices 12–23</text>
    <text x="90" y="345">x = 0</text>
    <text x="282" y="345">x = 0.5</text>
    <text x="474" y="345">x = 1</text>
  </g>
  <g fill="#172c3d" font-family="sans-serif" font-size="16" text-anchor="end">
    <text x="73" y="34">y = 0.75</text>
    <text x="73" y="322">y = 0</text>
  </g>
</svg>
