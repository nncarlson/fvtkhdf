name: Docs redirects

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate documentation redirects
        run: |
          python3 - <<'PY'
          from html import escape
          from json import dumps
          from pathlib import Path

          docs = "https://fvtkhdf.readthedocs.io/"
          output = Path("pages")
          output.mkdir()

          # Keep the old URLs working even if the Sphinx source tree changes.
          pages = """
          common composite field_data genindex hypertree image installation mb
          overview pdc rectilinear reference search stitching structured
          structured_grid unstructured vtk_cell_types
          """.split()
          redirects = {f"{page}.html": f"{docs}page/{page}.html" for page in pages}
          redirects["index.html"] = docs
          redirects["ug.html"] = f"{docs}en/docs-v0.7.0/ug.html"

          for name, target in redirects.items():
              url = escape(target, quote=True)
              (output / name).write_text(f"""<!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>fVTKHDF documentation moved</title>
          <link rel="canonical" href="{url}">
          <script>
          const destination = new URL({dumps(target)});
          destination.search = window.location.search;
          destination.hash = window.location.hash;
          window.location.replace(destination);
          </script>
          <noscript><meta http-equiv="refresh" content="0; url={url}"></noscript>
          <p>The fVTKHDF documentation has moved to <a href="{url}">Read the Docs</a>.</p>
          </html>
          """, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
